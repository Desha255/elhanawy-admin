<style>
:root {
  --bg: #F3F2EF; --panel: #FFFFFF; --panel2: #F5F3EF; --ink: #171512; --muted: #5A554C;
  --line: #DDD9D0; --line2: #C4BFB4; --gold: #8C6420;
  --btn: #0E0D0B; --btn-ink: #F6EBCB;
  --danger: #B3261E; --ok: #1E7A4C; --warn: #8A5B00; --info: #33547A;
  --rail: #0B0A09; --rail-ink: #EFEAE0; --rail-muted: #A39C8E; --rail-gold: #DDB05C; --rail-active: rgba(221, 176, 92, .16);
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 10px 28px rgba(0,0,0,.06);
  --font-body: 'IBM Plex Sans Arabic', 'Barlow', system-ui, sans-serif;
  --font-display: 'Reem Kufi', 'Barlow Condensed', system-ui, sans-serif;
  color-scheme: light;
}
:root[data-theme='dark'] {
  --bg: #0A0908; --panel: #12100E; --panel2: #181613; --ink: #EFEAE0; --muted: #A39C8E;
  --line: #2B2722; --line2: #4A443A; --gold: #E6BE6E;
  --btn: #DDB05C; --btn-ink: #241A06;
  --danger: #FFB4AB; --ok: #6FD3A0; --warn: #F0C15A; --info: #8FB4E8;
  --rail: #070606; --shadow: none;
  color-scheme: dark;
}
:root[lang='en'] { --font-body: 'Barlow', system-ui, sans-serif; --font-display: 'Barlow Condensed', system-ui, sans-serif; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--font-body); }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; margin: 0; line-height: 1.25; letter-spacing: .2px; }
h1 { font-size: 30px; } h2 { font-size: 21px; margin-block-end: 14px; } h3 { font-size: 19px; } h4 { font-size: 16px; margin-block-end: 8px; }
a { color: inherit; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.ic { display: inline-flex; flex: none; }
[hidden] { display: none !important; }

/* ---------- buttons & fields ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1.4px solid transparent; font: 600 15px var(--font-body); cursor: pointer; transition: transform .12s, opacity .15s, background .15s; }
.btn:active { transform: scale(.98); } .btn:disabled { opacity: .55; cursor: progress; }
.btn.primary { background: var(--btn); color: var(--btn-ink); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line2); }
.btn.danger { background: transparent; color: var(--danger); border-color: color-mix(in srgb, var(--danger) 55%, transparent); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.icon-btn, .top-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; min-width: 40px; justify-content: center; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; font: 500 14px var(--font-body); padding: 0 10px; }
.icon-btn:hover, .top-btn:hover { border-color: var(--line2); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.inline { flex-direction: row; align-items: center; gap: 10px; }
.field-label { font-size: 13px; color: var(--muted); font-weight: 500; }
.input { width: 100%; min-height: 44px; padding: 10px 14px; border-radius: 12px; border: 1.4px solid var(--line2); background: transparent; color: var(--ink); font: 400 15px var(--font-body); }
textarea.input { resize: vertical; min-height: 84px; }
.input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 22%, transparent); }
.input:disabled { opacity: .55; }
.check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--gold); }
.form { display: grid; gap: 14px; }
.form-actions { margin-block-start: 18px; display: flex; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

/* ---------- login ---------- */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #070606; color: #EFEAE0; position: relative; }
.login-tools { position: absolute; inset-block-start: 14px; inset-inline-end: 14px; display: flex; gap: 8px; }
.login .top-btn, .login .icon-btn { background: #12100E; color: #EFEAE0; border-color: #2B2722; }
.login-card { width: min(400px, 100%); text-align: center; display: grid; gap: 14px; }
.login-card .form { text-align: start; margin-block: 8px 0; }
.login-card .field-label { color: #A39C8E; }
.login-card .input { color: #EFEAE0; border-color: #4A443A; }
.login-card h1 { color: #DDB05C; font-size: 34px; }
.login-card .muted { margin: -6px 0 6px; color: #A39C8E; }
.login-card .btn.primary { background: #DDB05C; color: #241A06; }
.login-logo { width: 150px; height: auto; margin: 0 auto; }
.login-msg { min-height: 22px; color: #FFB4AB; font-size: 14px; }
.splash { min-height: 100vh; display: grid; place-items: center; background: #070606; }
.splash img { width: 110px; opacity: .9; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.rail { background: var(--rail); color: var(--rail-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 20px 14px; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 16px; border-block-end: 1px solid rgba(255,255,255,.08); }
.brand img { height: 58px; width: auto; }
.brand b { display: block; font: 600 24px var(--font-display); color: var(--rail-gold); line-height: 1.1; }
.brand small { color: var(--rail-muted); font-size: 12.5px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; color: var(--rail-muted); text-decoration: none; font-weight: 500; transition: background .15s, color .15s; }
.nav a:hover { color: var(--rail-ink); background: rgba(255,255,255,.05); }
.nav a.active { background: var(--rail-active); color: var(--rail-gold); }
.main { min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 28px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-block-end: 1px solid var(--line); }
.top-title { font: 600 18px var(--font-display); }
.top-actions { display: flex; align-items: center; gap: 8px; }
.who { color: var(--muted); font-size: 13px; margin-inline-end: 6px; direction: ltr; }
.banner { margin: 16px 28px 0; padding: 12px 16px; border-radius: 12px; background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); }
.page { padding: 26px 28px 80px; max-width: 1240px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-block-end: 20px; flex-wrap: wrap; }
.page-actions { display: flex; gap: 10px; align-items: center; }

/* ---------- cards / stats ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; margin-block-end: 20px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
.stat.accent { background: var(--rail); border-color: var(--rail); color: var(--rail-ink); }
.stat.accent .stat-value { color: var(--rail-gold); }
.stat-value { font: 600 32px/1.1 var(--font-display); }
.stat-label { color: var(--muted); font-size: 13.5px; margin-block-start: 4px; }
.stat.accent .stat-label { color: var(--rail-muted); }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-block-end: 16px; }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); border: 1.4px dashed var(--line2); border-radius: 14px; }

.bars { display: flex; align-items: flex-end; gap: 10px; height: 190px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; min-width: 0; }
.bar { width: 100%; max-width: 46px; min-height: 3px; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, var(--gold), color-mix(in srgb, var(--gold) 55%, transparent)); }
.bar-num { font-weight: 600; font-size: 13px; } .bar-lbl { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

/* ---------- bookings ---------- */
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-block-end: 16px; }
.toolbar .search { max-width: 340px; flex: 1 1 220px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; color: var(--ink); font: 500 14px var(--font-body); cursor: pointer; }
.tab.active { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.tab .count { font-size: 12px; opacity: .8; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, currentColor 16%, transparent); }
.bk-list { display: grid; gap: 12px; }
.bk { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 16px; align-items: start; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-inline-start: 4px solid var(--line2); border-radius: 16px; }
.bk.s-pending { border-inline-start-color: var(--warn); } .bk.s-confirmed { border-inline-start-color: var(--ok); }
.bk.s-cancelled, .bk.s-rejected { border-inline-start-color: var(--danger); opacity: .85; } .bk.s-completed { border-inline-start-color: var(--info); }
.bk-time { font: 600 22px var(--font-display); }
.bk-name { font-weight: 600; font-size: 16.5px; }
.bk-phone { display: inline-flex; gap: 6px; align-items: center; color: var(--gold); text-decoration: none; font-size: 14px; direction: ltr; }
.bk-side { display: grid; gap: 10px; justify-items: end; }
.bk-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.note { margin-block-start: 6px; padding: 6px 10px; font-size: 13px; border-radius: 8px; background: var(--panel2); color: var(--muted); }
.badge { display: inline-flex; align-items: center; padding: 3px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1px solid transparent; }
.badge.s-pending { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.badge.s-confirmed { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.badge.s-completed { color: var(--info); background: color-mix(in srgb, var(--info) 14%, transparent); }
.badge.s-cancelled, .badge.s-rejected { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

/* ---------- customers / services / schedule ---------- */
.cust-list { display: grid; gap: 10px; }
.cust { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; cursor: pointer; }
.cust:hover { border-color: var(--line2); }
.avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--btn); color: var(--btn-ink); font: 600 20px var(--font-display); }
.cust-meta { text-align: end; }
.hist { display: grid; gap: 8px; } .hist-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--panel2); flex-wrap: wrap; }
.svc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.svc { display: grid; gap: 10px; align-content: start; } .svc.off { opacity: .62; }
.svc-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.svc-meta { display: flex; gap: 14px; align-items: baseline; } .svc-meta strong { font: 600 20px var(--font-display); color: var(--gold); }
.svc-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hours { display: grid; gap: 10px; }
.hours-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border: 1px solid var(--line); border-radius: 14px; }
.hours-row .check { min-width: 130px; }
.hours-times { display: flex; align-items: center; gap: 10px; } .hours-times .input { width: 130px; }
.inline-form { display: flex; gap: 10px; flex-wrap: wrap; margin-block-end: 14px; } .inline-form .input { width: 200px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px 6px 14px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-size: 14px; }
.chip-x { border: 0; background: transparent; color: var(--danger); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 6px; }
.table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.table th { text-align: start; color: var(--muted); font-weight: 500; font-size: 13px; }
.table th, .table td { padding: 9px 6px; border-block-end: 1px solid var(--line); }

/* ---------- modal / toast ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.modal { width: min(460px, 100%); max-height: 92vh; overflow-y: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line2); border-radius: 20px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
.modal.wide { width: min(720px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 18px 20px 0; }
.modal-body { padding: 16px 20px; } .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 0 20px 18px; }
.toasts { position: fixed; z-index: 80; inset-block-end: 18px; inset-inline: 0; display: grid; gap: 8px; justify-items: center; pointer-events: none; padding: 0 14px; }
.toast { pointer-events: auto; max-width: 480px; padding: 12px 18px; border-radius: 12px; background: var(--btn); color: var(--btn-ink); font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.3); transition: opacity .35s, transform .35s; }
.toast.err { background: var(--danger); color: #fff; } :root[data-theme='dark'] .toast.err { color: #3a0905; }
.toast.out { opacity: 0; transform: translateY(8px); }

/* ---------- responsive ---------- */
@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; flex-direction: row; padding: 8px 10px; overflow-x: auto; overflow-y: hidden; gap: 6px; }
  .brand { display: none; }
  .nav { flex-direction: row; gap: 6px; }
  .nav a { white-space: nowrap; padding: 9px 12px; }
  .topbar { padding: 10px 14px; } .who { display: none; }
  .page { padding: 18px 14px 80px; } .banner { margin: 12px 14px 0; }
  .cols, .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .bk { grid-template-columns: 1fr; gap: 10px; } .bk-side { justify-items: start; grid-auto-flow: row; } .bk-actions { justify-content: flex-start; }
  .bk-when { display: flex; gap: 10px; align-items: baseline; }
  .cust { grid-template-columns: 44px minmax(0, 1fr); } .cust-meta { grid-column: 1 / -1; text-align: start; }
  h1 { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

// ---------------------------------------------------------------- DOM helper
function h(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v; // trusted static SVG only
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'for') node.htmlFor = v;
    else if (k in node && k !== 'list') node[k] = v;
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === undefined || kid === null || kid === false) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return node;
}

// ---------------------------------------------------------------- modal
function openModal({ title, content, actions = [], wide = false, onClose }) {
  const overlay = h('div', { class: 'overlay' });
  const box = h('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true' },
    h('div', { class: 'modal-head' },
      h('h3', {}, title),
      h('button', { type: 'button', class: 'icon-btn', 'aria-label': t('close'), onclick: () => close() }, icon('x'))),
    h('div', { class: 'modal-body' }, content),
    actions.length ? h('div', { class: 'modal-foot' }, actions) : null);
  overlay.append(box);
  function onKey(e) { if (e.key === 'Escape') close(); }
  function close() {
    overlay.remove();
    document.removeEventListener('keydown', onKey);
    if (onClose) onClose();
  }
  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', onKey);
  document.body.append(overlay);
  return { close, box };
}

function confirmDialog(message, opts = {}) {
  return new Promise((resolve) => {
    let done = false;
    let m = null;
    const finish = (v) => { if (done) return; done = true; if (m) m.close(); resolve(v); };
    m = openModal({
      title: t('confirmTitle'),
      content: h('p', {}, message),
      onClose: () => finish(false),
      actions: [
        button(t('cancel'), () => finish(false), 'ghost'),
        button(opts.okLabel || t('confirm'), () => finish(true), opts.danger ? 'danger' : 'primary'),
      ],
    });
  });
}

  });
}

function fmtDate(dateStr, withWeekday = true) {
  if (!dateStr) return '';
  const locale = getLang() === 'ar' ? 'ar-EG-u-nu-latn' : 'en-GB';
  const opts = { day: 'numeric', month: 'short', timeZone: 'UTC' };
  if (withWeekday) opts.weekday = 'short';
  return new Intl.DateTimeFormat(locale, opts).format(new Date(dateStr + 'T12:00:00Z'));
}

function fmtTime(hhmm) {
  if (!hhmm) return '';
  const [hh, mm] = hhmm.split(':').map(Number);
  const suffix = hh >= 12 ? t('pm') : t('am');
  return `${hh % 12 || 12}:${String(mm).padStart(2, '0')} ${suffix}`;
}

function tsToDate(ts) {

// ---- booking-logic.js ----
// Pure booking helpers (no DOM, no Firebase) - unit tested in tools/logic-test.mjs.
// They mirror lib/features/booking/domain/slot_calculator.dart in the mobile app.

const CAIRO = 'Africa/Cairo';

/** firestore.rules allows at most this many slot locks per booking. */
const MAX_LOCKS = 6;

function pad2(n) { return String(n).padStart(2, '0'); }

/** "20260925_1900": slotLocks document id for the slot starting at minuteOfDay. */
function lockIdFor(dateStr, minuteOfDay) {
  return dateStr.replace(/-/g, '') + '_' + pad2(Math.floor(minuteOfDay / 60)) + pad2(minuteOfDay % 60);
}

function locksNeeded(durationMinutes, stepMinutes) {
  return Math.ceil(durationMinutes / stepMinutes);
}

function lockIdsFor(dateStr, timeStr, durationMinutes, stepMinutes) {
  const [h, m] = timeStr.split(':').map(Number);
  const start = h * 60 + m;
  const ids = [];
  for (let i = 0; i < locksNeeded(durationMinutes, stepMinutes); i++) ids.push(lockIdFor(dateStr, start + i * stepMinutes));
  return ids;
}

function tzOffsetMs(utcMs) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: CAIRO, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  }).formatToParts(new Date(utcMs));
  const o = {};
  for (const p of parts) o[p.type] = p.value;
  const asUtc = Date.UTC(+o.year, +o.month - 1, +o.day, +o.hour % 24, +o.minute, +o.second);
  return asUtc - Math.floor(utcMs / 1000) * 1000;
}

/** "2026-09-25" + "19:00" in Africa/Cairo  ->  the exact instant (Date, UTC). */
function cairoToUtc(dateStr, timeStr) {
  const [y, mo, d] = dateStr.split('-').map(Number);
  const [h, mi] = timeStr.split(':').map(Number);
  const naive = Date.UTC(y, mo - 1, d, h, mi);
  const guess = naive - tzOffsetMs(naive);
  return new Date(naive - tzOffsetMs(guess));
}

/** Live copy of the Firestore data the dashboard needs. Everything is real-time. */
const store = {
  bookings: [],
  customers: [],
  services: [],
  settings: { salon: null, workingHours: null, bookingRules: null, closedDates: null },
  ready: {},
  error: null,
};

const LISTENERS = new Set();
let UNSUBS = [];
let NEW_BOOKING_HANDLER = null;

function onStore(fn, topics) {
  const entry = { fn, topics };
  LISTENERS.add(entry);
  return () => LISTENERS.delete(entry);
}

function emit(topic) {
  LISTENERS.forEach((l) => { if (!l.topics || l.topics.includes(topic)) l.fn(topic); });
}

function setNewBookingHandler(fn) { NEW_BOOKING_HANDLER = fn; }

function stopStore() {
  UNSUBS.forEach((u) => u());
  UNSUBS = [];
  store.bookings = []; store.customers = []; store.services = [];
  store.settings = { salon: null, workingHours: null, bookingRules: null, closedDates: null };
  store.ready = {}; store.error = null;
}

function startStore() {
  stopStore();
  const fail = (e) => { store.error = e; emit('error'); };

  let firstBookings = true;
  UNSUBS.push(onSnapshot(
    query(collection(db, 'bookings'), orderBy('startAt', 'desc'), limit(1000)),
    (snap) => {
      if (!firstBookings && NEW_BOOKING_HANDLER) {
        snap.docChanges().forEach((c) => {
          if (c.type === 'added' && !c.doc.metadata.hasPendingWrites) NEW_BOOKING_HANDLER({ id: c.doc.id, ...c.doc.data() });
        });
      }
      firstBookings = false;
      store.bookings = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      store.ready.bookings = true;
      emit('bookings');
    }, fail));

  UNSUBS.push(onSnapshot(
    query(collection(db, 'users'), where('role', '==', 'customer')),
    (snap) => {
      store.customers = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      store.ready.customers = true;
      emit('customers');
    }, fail));

  UNSUBS.push(onSnapshot(collection(db, 'services'), (snap) => {
    store.services = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
    store.ready.services = true;
    emit('services');
  }, fail));

  const loaded = new Set();
  ['salon', 'workingHours', 'bookingRules', 'closedDates'].forEach((name) => {
    UNSUBS.push(onSnapshot(doc(db, 'settings', name), (snap) => {
      store.settings[name] = snap.exists() ? snap.data() : null;
      loaded.add(name);
      if (loaded.size === 4) store.ready.settings = true;
      emit('settings');
    }, fail));
  });
}

/** Turn a Firebase / function error into a friendly, localized message. */
function errMsg(e) {
  const m = (e && e.message) || '';
  const code = (e && e.code) || '';
  const known = ['slot_taken', 'slot_in_past', 'too_far_ahead', 'closed_date', 'closed_day', 'outside_working_hours',
    'invalid_datetime', 'invalid_slot', 'booking_not_found', 'invalid_status'];
  const k = known.find((x) => m.includes(x));
  if (k) return t('err_' + k);
  if (code.includes('permission-denied')) return t('errPermission');
  if (code.includes('not-found') || code.includes('unavailable') || code.includes('internal') || /Failed to fetch|NetworkError/i.test(m)) return t('errFunctionsOff');
  return t('errGeneric');
}

function statusBadge(status) {

}

/**
 * Change a booking as the admin, in ONE atomic batch: the booking update + the slot locks it needs
 * (created when it becomes / stays active, released when it is cancelled, rejected or completed).
 * changes: { status?, date?, time?, adminNote?, cancellationReason? }
 */
async function updateBooking(b, changes) {
  try {
    const step = Number((store.settings.bookingRules || {}).slotStepMinutes) || 15;
    const newStatus = changes.status || b.status;
    const date = changes.date || b.date;
    const time = changes.time || b.time;
    const rescheduled = date !== b.date || time !== b.time;
    const wasActive = ACTIVE_STATUSES.includes(b.status);
    const wantActive = ACTIVE_STATUSES.includes(newStatus);
    const oldIds = b.lockIds || [];

    let newIds;
    if (!wantActive) newIds = [];
    else if (wasActive && !rescheduled) newIds = oldIds;       // e.g. only confirming or editing a note
    else newIds = lockIdsFor(date, time, b.durationMinutes, step);
    if (newIds.length > MAX_LOCKS) throw new Error('too_long');

    const update = { updatedAt: serverTimestamp(), lockIds: newIds };
    if (changes.status) update.status = changes.status;
    if (typeof changes.adminNote === 'string') update.adminNote = changes.adminNote;
    if (changes.status === 'cancelled' || changes.status === 'rejected') {
      update.cancelledBy = 'admin';
      if (changes.cancellationReason) update.cancellationReason = changes.cancellationReason;
    }
    if (rescheduled) {
      const start = cairoToUtc(date, time);
      update.date = date;
      update.time = time;
      update.startAt = Timestamp.fromDate(start);
      update.endAt = Timestamp.fromDate(new Date(start.getTime() + b.durationMinutes * 60000));
    }

    const toCreate = newIds.filter((id) => !oldIds.includes(id));
    const toDelete = oldIds.filter((id) => !newIds.includes(id));
    for (const id of toCreate) {
      const snap = await getDoc(doc(db, 'slotLocks', id));
      if (snap.exists()) throw new Error('slot_taken');
    }

    const batch = writeBatch(db);
    const lockStart = update.startAt || b.startAt;
    toCreate.forEach((id) => batch.set(doc(db, 'slotLocks', id), { bookingId: b.id, startAt: lockStart }));
    toDelete.forEach((id) => batch.delete(doc(db, 'slotLocks', id)));
    batch.update(doc(db, 'bookings', b.id), update);
    await batch.commit();
    toast(t('saved'));
    return true;
  } catch (e) {
    console.error(e);
    toast(errMsg(e), 'err');
    return false;
  }
}

async function changeStatus(b, status, btn, askReason) {
  let reason;
  if (askReason) {
    reason = await promptReason(t('reasonTitle'));
    if (reason === null) return;
  }
  await withBusy(btn, () => updateBooking(b, { status, cancellationReason: reason || '' }));
}

function openEditBooking(b) {
  const active = ACTIVE_STATUSES.includes(b.status);
  const date = input({ type: 'date', value: b.date || '', disabled: !active });
  const time = input({ type: 'time', value: b.time || '', step: 900, disabled: !active });
  const note = h('textarea', { class: 'input', rows: 3, maxLength: 500 }, b.adminNote || '');
  const saveBtn = button(t('save'), async () => {
    const changes = {};
    if (active && date.value && date.value !== b.date) changes.date = date.value;
    if (active && time.value && time.value !== b.time) changes.time = time.value;
    if ((note.value || '') !== (b.adminNote || '')) changes.adminNote = note.value.trim();
    if (Object.keys(changes).length === 0) { m.close(); return; }
    const ok = await withBusy(saveBtn, () => updateBooking(b, changes));
    if (ok) m.close();
  }, 'primary');
  const m = openModal({
    title: t('editBookingTitle'),
    content: h('div', { class: 'form' },
      h('div', { class: 'muted' }, `${b.customerName || ''} — ${pick(b, 'serviceName')}`),
      h('div', { class: 'grid2' }, field(t('fDate'), date), field(t('fTime'), time)),
      active ? h('div', { class: 'muted small' }, t('reschedNote')) : null,
      field(t('fNote'), note)),
    actions: [button(t('cancel'), () => m.close(), 'ghost'), saveBtn],
  });
}

/** Action buttons that make sense for the booking's current status. */
function bookingActions(b) {
  const out = [];
  if (b.status === 'pending') {
    const c = button(t('actConfirm'), () => changeStatus(b, 'confirmed', c, false), 'primary', { small: true, icon: 'check' });
    const r = button(t('actReject'), () => changeStatus(b, 'rejected', r, true), 'danger', { small: true, icon: 'x' });
    out.push(c, r);
  } else if (b.status === 'confirmed') {
    const c = button(t('actComplete'), () => changeStatus(b, 'completed', c, false), 'primary', { small: true, icon: 'check' });
    const x = button(t('actCancel'), () => changeStatus(b, 'cancelled', x, true), 'danger', { small: true, icon: 'x' });
    out.push(c, x);
  }
  out.push(button(t('actEdit'), () => openEditBooking(b), 'ghost', { small: true, icon: 'edit' }));
  return out;
}

function bookingRow(b) {
  return h('article', { class: 'bk s-' + b.status },
    h('div', { class: 'bk-when' },
      h('div', { class: 'bk-time' }, fmtTime(b.time)),

const sortByWhen = (a, b) => (a.date + a.time).localeCompare(b.date + b.time);

function viewDashboard(root) {
  const stats = h('div', { class: 'stats' });
  const chart = h('div', { class: 'card' });
  const nextBox = h('div', { class: 'card' });
  const pendingBox = h('div', { class: 'card' });
  root.append(pageHeader(t('navDashboard')), stats,
    h('div', { class: 'cols' }, nextBox, pendingBox), chart);

  function stat(label, value, accent) {
    return h('div', { class: 'stat' + (accent ? ' accent' : '') }, h('div', { class: 'stat-value' }, String(value)), h('div', { class: 'stat-label' }, label));
  }

  function draw() {
    const today = todayCairo();
    const all = store.bookings;
    const todays = all.filter((b) => b.date === today);
    const pending = all.filter((b) => b.status === 'pending');
    const confirmedUpcoming = all.filter((b) => b.status === 'confirmed' && b.date >= today);
    const completedToday = todays.filter((b) => b.status === 'completed');
    const cancelledToday = todays.filter((b) => b.status === 'cancelled' || b.status === 'rejected');
    const revenue = completedToday.reduce((s, b) => s + (Number(b.servicePrice) || 0), 0);

    stats.replaceChildren(
      stat(t('statToday'), todays.length, true),
      stat(t('statPending'), pending.length),
      stat(t('statConfirmed'), confirmedUpcoming.length),
      stat(t('statCompleted'), completedToday.length),
      stat(t('statCancelled'), cancelledToday.length),
      stat(t('statCustomers'), store.customers.length),
      stat(t('statRevenue'), fmtMoney(revenue)));

    const nextList = todays.filter((b) => ACTIVE_STATUSES.includes(b.status)).sort(sortByWhen);
    nextBox.replaceChildren(h('h2', {}, t('todayNext')),
      nextList.length ? h('div', { class: 'bk-list' }, nextList.map(bookingRow)) : emptyBox(t('noBookingsToday')));

    const pendList = pending.slice().sort(sortByWhen).slice(0, 6);
    pendingBox.replaceChildren(h('h2', {}, t('pendingRequests')),
      pendList.length ? h('div', { class: 'bk-list' }, pendList.map(bookingRow)) : emptyBox(t('noPending')));

    // last 7 days, bookings that were not cancelled/rejected
    const days = [];
    for (let i = 6; i >= 0; i--) days.push(addDays(today, -i));
    const counts = days.map((d) => all.filter((b) => b.date === d && b.status !== 'cancelled' && b.status !== 'rejected').length);
    const max = Math.max(1, ...counts);
    chart.replaceChildren(h('h2', {}, t('last7')),
      h('div', { class: 'bars' }, days.map((d, i) =>
        h('div', { class: 'bar-col' },
          h('div', { class: 'bar-num' }, String(counts[i])),
          h('div', { class: 'bar', style: `height:${Math.round((counts[i] / max) * 100)}%` }),
          h('div', { class: 'bar-lbl' }, fmtDate(d, false))))));
  }

  draw();
  return onStore(draw, ['bookings', 'customers']);
}

const FILTERS = ['today', 'upcoming', 'pending', 'previous', 'all'];

function matchesFilter(b, f, today) {
  switch (f) {
    case 'today': return b.date === today;
    case 'upcoming': return b.date >= today && ACTIVE_STATUSES.includes(b.status);
    case 'pending': return b.status === 'pending';
    case 'previous': return b.date < today;
    default: return true;
  }
}

function viewBookings(root) {
  let filter = 'pending';
  let query = '';
  const tabs = h('div', { class: 'tabs' });
  const search = input({
    type: 'search', class: 'input search', placeholder: t('searchBookings'),
    oninput: (e) => { query = e.target.value.trim().toLowerCase(); drawList(); },
  });
  const list = h('div', { class: 'bk-list' });
  root.append(pageHeader(t('navBookings')), h('div', { class: 'toolbar' }, tabs, search), list);

  function visible(f) {
    const today = todayCairo();
    return store.bookings.filter((b) => matchesFilter(b, f, today));
  }

  function drawTabs() {
    tabs.replaceChildren(...FILTERS.map((f) => h('button', {
      type: 'button', class: 'tab' + (f === filter ? ' active' : ''),
      onclick: () => { filter = f; drawTabs(); drawList(); },
    }, t('f_' + f), h('span', { class: 'count' }, String(visible(f).length)))));
  }

  function drawList() {
    let rows = visible(filter);
    if (query) {
      rows = rows.filter((b) => [b.customerName, b.customerPhone, b.serviceNameAr, b.serviceNameEn]
        .some((v) => (v || '').toLowerCase().includes(query)));
    }
    const asc = filter === 'today' || filter === 'upcoming' || filter === 'pending';
    rows = rows.slice().sort((a, b) => {
      const c = (a.date + a.time).localeCompare(b.date + b.time);
      return asc ? c : -c;
    });
    list.replaceChildren(...(rows.length ? rows.map(bookingRow) : [emptyBox(t('noBookings'))]));
  }

  drawTabs();
  drawList();
  return onStore(() => { drawTabs(); drawList(); }, ['bookings']);
}

function openServiceForm(svc) {
  const isNew = !svc;
  const s = svc || { active: true, durationMinutes: 30, sortOrder: store.services.length + 1, price: '' };
  const nameAr = input({ value: s.nameAr || '' });
  const nameEn = input({ value: s.nameEn || '', dir: 'ltr' });
  const descAr = h('textarea', { class: 'input', rows: 2 }, s.descriptionAr || '');
  const descEn = h('textarea', { class: 'input', rows: 2, dir: 'ltr' }, s.descriptionEn || '');
  const price = input({ type: 'number', min: 0, step: '0.5', value: s.price, inputMode: 'decimal' });
  const duration = input({ type: 'number', min: 5, step: 5, value: s.durationMinutes });
  const order = input({ type: 'number', step: 1, value: s.sortOrder });
  const image = input({ type: 'url', value: s.imageUrl || '', dir: 'ltr', placeholder: 'https://…' });
  const active = h('input', { type: 'checkbox', checked: s.active !== false });

  const saveBtn = button(t('save'), async () => {
    if (!nameAr.value.trim() || !nameEn.value.trim()) return toast(t('errNames'), 'err');
    const p = Number(price.value);
    if (price.value === '' || !Number.isFinite(p) || p < 0) return toast(t('errPrice'), 'err');
    const d = Number(duration.value);
    if (!Number.isFinite(d) || d < 5) return toast(t('errDuration'), 'err');
    const step = Number((store.settings.bookingRules || {}).slotStepMinutes) || 15;
    if (Math.ceil(d / step) > MAX_LOCKS) return toast(t('errDurationMax', { n: MAX_LOCKS * step }), 'err');
    const data = {
      nameAr: nameAr.value.trim(), nameEn: nameEn.value.trim(),
      descriptionAr: descAr.value.trim(), descriptionEn: descEn.value.trim(),
      price: p, durationMinutes: Math.round(d), sortOrder: Number(order.value) || 0,
      imageUrl: image.value.trim(), active: active.checked, updatedAt: serverTimestamp(),
    };
    try {
      await withBusy(saveBtn, () => (isNew
        ? addDoc(collection(db, 'services'), { ...data, createdAt: serverTimestamp() })
        : updateDoc(doc(db, 'services', svc.id), data)));
      toast(t('saved'));
      m.close();
    } catch (e) {
      console.error(e);
      toast(t('errGeneric'), 'err');
    }
  }, 'primary');

  const m = openModal({
    title: isNew ? t('svcAdd') : t('svcEdit'),
    wide: true,
    content: h('div', { class: 'form' },
      h('div', { class: 'grid2' }, field(t('svcNameAr'), nameAr), field(t('svcNameEn'), nameEn)),
      h('div', { class: 'grid2' }, field(t('svcDescAr'), descAr), field(t('svcDescEn'), descEn)),
      h('div', { class: 'grid3' }, field(t('svcPrice'), price), field(t('svcDuration'), duration), field(t('svcOrder'), order)),
      field(t('svcImage'), image),
      h('label', { class: 'check' }, active, h('span', {}, t('svcActive')))),
    actions: [button(t('cancel'), () => m.close(), 'ghost'), saveBtn],
  });
}

// Saturday first, as in the salon's week. Keys match the Cloud Functions (mon..sun).
const DAYS = ['sat', 'sun', 'mon', 'tue', 'wed', 'thu', 'fri'];

function viewSchedule(root) {
  const hoursCard = h('div', { class: 'card' });
  const datesCard = h('div', { class: 'card' });
  root.append(pageHeader(t('navSchedule')), hoursCard, datesCard);
  let drawn = false;

  function drawHours() {
    const saved = store.settings.workingHours || {};
    const rows = DAYS.map((d) => {
      const v = saved[d] || { open: true, from: '10:00', to: '22:00' };
      const open = h('input', { type: 'checkbox', checked: v.open !== false });
      const from = input({ type: 'time', value: v.from || '10:00', step: 900 });
      const to = input({ type: 'time', value: v.to || '22:00', step: 900 });
      const sync = () => { from.disabled = to.disabled = !open.checked; };
      open.addEventListener('change', sync);
      sync();
      return { d, open, from, to, node: h('div', { class: 'hours-row' },
        h('label', { class: 'check' }, open, h('strong', {}, t('day_' + d))),
        h('div', { class: 'hours-times' }, h('span', { class: 'muted' }, t('from')), from, h('span', { class: 'muted' }, t('to')), to)) };
    });
    const saveBtn = button(t('save'), async () => {
      const data = {};
      for (const r of rows) {
        if (r.open.checked && r.to.value <= r.from.value) return toast(t('errHours'), 'err');
        data[r.d] = { open: r.open.checked, from: r.from.value, to: r.to.value };
      }
      try {
        await withBusy(saveBtn, () => setDoc(doc(db, 'settings', 'workingHours'), { ...data, updatedAt: serverTimestamp() }));
        toast(t('saved'));
      } catch (e) { console.error(e); toast(t('errGeneric'), 'err'); }
    }, 'primary');
    hoursCard.replaceChildren(h('h2', {}, t('schedTitle')), h('div', { class: 'hours' }, rows.map((r) => r.node)),
      h('div', { class: 'form-actions' }, saveBtn));
  }

  function drawDates() {
    const dates = ((store.settings.closedDates || {}).dates || []).slice().sort();
    const picker = input({ type: 'date', min: todayCairo() });
    async function save(next) {
      try { await setDoc(doc(db, 'settings', 'closedDates'), { dates: next, updatedAt: serverTimestamp() }); toast(t('saved')); }
      catch (e) { console.error(e); toast(t('errGeneric'), 'err'); }
    }
    const addBtn = button(t('addDate'), () => {
      if (!picker.value || dates.includes(picker.value)) return;
      save([...dates, picker.value].sort());
      picker.value = '';
    }, 'primary', { icon: 'plus' });
    datesCard.replaceChildren(h('h2', {}, t('closedDates')),
      h('div', { class: 'inline-form' }, picker, addBtn),
      dates.length
        ? h('div', { class: 'chips' }, dates.map((d) => h('span', { class: 'chip' }, fmtDate(d),
          h('button', { type: 'button', class: 'chip-x', 'aria-label': t('delete'), onclick: () => save(dates.filter((x) => x !== d)) }, '×'))))
        : emptyBox(t('noClosedDates')));
  }

  function draw() {
    if (!store.ready.settings) return;
    if (!drawn) { drawn = true; drawHours(); }   // form: draw once so typing is never lost
    drawDates();
  }

  draw();
  return onStore(draw, ['settings']);
}

  audience.addEventListener('change', () => { customer.hidden = audience.value !== 'one'; });

  const titleAr = input({}); const titleEn = input({ dir: 'ltr' });
  const bodyAr = h('textarea', { class: 'input', rows: 3 });
  const bodyEn = h('textarea', { class: 'input', rows: 3, dir: 'ltr' });

  const sendBtn = button(t('send'), async () => {
    if (![titleAr, titleEn, bodyAr, bodyEn].every((el) => el.value.trim())) return toast(t('errNotif'), 'err');
    try {
      const res = await withBusy(sendBtn, () => callAdminSendNotification({
        ...(audience.value === 'one' ? { userId: customer.value } : {}),
        titleAr: titleAr.value.trim(), titleEn: titleEn.value.trim(), bodyAr: bodyAr.value.trim(), bodyEn: bodyEn.value.trim(),
      }));
      toast(t('sent', { n: (res.data && res.data.sent) || 0 }));
      [titleAr, titleEn, bodyAr, bodyEn].forEach((el) => { el.value = ''; });
    } catch (e) { console.error(e); toast(errMsg(e), 'err'); }
  }, 'primary');

  root.append(pageHeader(t('navNotifications')), h('div', { class: 'card' },
    h('h2', {}, t('notifTitle')), h('p', { class: 'muted' }, t('notifHint')),
    h('div', { class: 'form' },
      h('div', { class: 'grid2' }, field(t('notifAudience'), audience), field(' ', customer)),
      h('div', { class: 'grid2' }, field(t('titleAr'), titleAr), field(t('titleEn'), titleEn)),
      h('div', { class: 'grid2' }, field(t('bodyAr'), bodyAr), field(t('bodyEn'), bodyEn))),
    h('div', { class: 'form-actions' }, sendBtn)));
  return onStore(fillCustomers, ['customers']);
}

// ---- views/reports.js ----

function viewReports(root) {
  let range = '30';
  const select = h('select', { class: 'input', onchange: (e) => { range = e.target.value; draw(); } },
    [['7', 'rep7'], ['30', 'rep30'], ['90', 'rep90'], ['all', 'repAll']].map(([v, k]) => h('option', { value: v, selected: v === range }, t(k))));
  const body = h('div', {});
  root.append(pageHeader(t('navReports'), h('label', { class: 'field inline' }, h('span', { class: 'field-label' }, t('repRange')), select)), body);

  function draw() {
    const today = todayCairo();
    const from = range === 'all' ? '0000-00-00' : addDays(today, -Number(range) + 1);
    const rows = store.bookings.filter((b) => b.date >= from && b.date <= today);
    const completed = rows.filter((b) => b.status === 'completed');
    const lost = rows.filter((b) => b.status === 'cancelled' || b.status === 'rejected');
    const revenue = completed.reduce((s, b) => s + (Number(b.servicePrice) || 0), 0);
    const rate = rows.length ? Math.round((lost.length / rows.length) * 100) : 0;

    const byService = new Map();
    completed.forEach((b) => {
      const k = b.serviceId || b.serviceNameEn;
      const cur = byService.get(k) || { name: pick(b, 'serviceName'), n: 0, sum: 0 };
      cur.n += 1; cur.sum += Number(b.servicePrice) || 0;
      byService.set(k, cur);
    });
    const byDay = new Map();
    rows.forEach((b) => { byDay.set(b.date, (byDay.get(b.date) || 0) + 1); });

    const stat = (label, value) => h('div', { class: 'stat' }, h('div', { class: 'stat-value' }, String(value)), h('div', { class: 'stat-label' }, label));
    body.replaceChildren(
      h('div', { class: 'stats' }, stat(t('repTotal'), rows.length), stat(t('repCompleted'), completed.length),
        stat(t('repRevenue'), fmtMoney(revenue)), stat(t('repCancelRate'), rate + '%')),
      h('div', { class: 'cols' },
        h('div', { class: 'card' }, h('h2', {}, t('repByService')),
          byService.size ? h('table', { class: 'table' },
            h('thead', {}, h('tr', {}, h('th', {}, t('service')), h('th', {}, t('count')), h('th', {}, t('repRevenue')))),
            h('tbody', {}, [...byService.values()].sort((a, b) => b.sum - a.sum).map((s) =>
              h('tr', {}, h('td', {}, s.name), h('td', {}, String(s.n)), h('td', {}, fmtMoney(s.sum)))))) : emptyBox(t('noBookings'))),
        h('div', { class: 'card' }, h('h2', {}, t('repByDay')),
          byDay.size ? h('table', { class: 'table' },
            h('tbody', {}, [...byDay.entries()].sort((a, b) => b[0].localeCompare(a[0])).slice(0, 31).map(([d, n]) =>
              h('tr', {}, h('td', {}, fmtDate(d)), h('td', {}, String(n)))))) : emptyBox(t('noBookings')))));
  }

  draw();
  return onStore(draw, ['bookings']);
}

// ---- main.js ----

const ROUTES = {
  dashboard: { key: 'navDashboard', icon: 'dashboard', view: viewDashboard },
  bookings: { key: 'navBookings', icon: 'calendar', view: viewBookings },
  customers: { key: 'navCustomers', icon: 'users', view: viewCustomers },
  services: { key: 'navServices', icon: 'scissors', view: viewServices },
  schedule: { key: 'navSchedule', icon: 'clock', view: viewSchedule },
  notifications: { key: 'navNotifications', icon: 'bell', view: viewNotifications },
  reports: { key: 'navReports', icon: 'chart', view: viewReports },
  settings: { key: 'navSettings', icon: 'settings', view: viewSettings },
};

const appRoot = document.getElementById('app');
let CURRENT_USER = null;
let CLEANUP = null;
let ERROR_OFF = null;
let LOGIN_MESSAGE = '';

function themeIcon() { return icon(currentTheme() === 'dark' ? 'sun' : 'moon'); }

function toolbarButtons(rerender, extra) {
  return [
    h('button', { type: 'button', class: 'top-btn', onclick: () => { setLang(getLang() === 'ar' ? 'en' : 'ar'); rerender(); } }, icon('globe', 18), t('langOther')),
    h('button', { type: 'button', class: 'icon-btn', title: t('themeToggle'), 'aria-label': t('themeToggle'), onclick: () => { toggleTheme(); rerender(); } }, themeIcon()),
    ...(extra || []),
  ];
}

// ---------------------------------------------------------------- login
function showLogin(message) {
  if (CLEANUP) { CLEANUP(); CLEANUP = null; }
  if (ERROR_OFF) { ERROR_OFF(); ERROR_OFF = null; }
  const email = input({ type: 'email', autocomplete: 'username', dir: 'ltr', required: true });
  const password = input({ type: 'password', autocomplete: 'current-password', dir: 'ltr', required: true });
  const msg = h('div', { class: 'login-msg', role: 'alert' }, message || '');
  const go = async () => {
    msg.textContent = '';
    if (!email.value.trim() || !password.value) return;
    try {
      await withBusy(loginBtn, () => signInWithEmailAndPassword(auth, email.value.trim(), password.value));
    } catch (e) {
      const c = e && e.code || '';
      msg.textContent = c.includes('network') ? t('errNetwork') : c.includes('too-many') ? t('errTooMany') : (c.includes('api-key') || c.includes('invalid-app')) ? t('errConfig') : t('errLogin');
    }
  };
  const loginBtn = button(t('login'), go, 'primary');
  [email, password].forEach((el) => el.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); }));
  appRoot.replaceChildren(h('div', { class: 'login' },
    h('div', { class: 'login-tools' }, toolbarButtons(() => showLogin(message))),
    h('div', { class: 'login-card' },
      h('img', { class: 'login-logo', src: window.LOGO_DATA, alt: '' }),
      h('h1', {}, t('brandName')), h('p', { class: 'muted' }, t('adminPanel')),
      h('div', { class: 'form' }, field(t('email'), email), field(t('password'), password)),
      msg, loginBtn)));
}

// ---------------------------------------------------------------- shell + router
function routeName() {
  const r = (location.hash || '#/dashboard').replace('#/', '');
  return ROUTES[r] ? r : 'dashboard';
}

function renderShell() {
  const nav = h('nav', { class: 'nav' }, Object.entries(ROUTES).map(([name, r]) =>
    h('a', { href: '#/' + name, 'data-route': name }, icon(r.icon), h('span', {}, t(r.key)))));
  const title = h('div', { class: 'top-title' });
  const content = h('main', { class: 'page', id: 'content' });
  const banner = h('div', { class: 'banner', hidden: true }, t('errRules'));
  appRoot.replaceChildren(h('div', { class: 'shell' },
    h('aside', { class: 'rail' },
      h('div', { class: 'brand' }, h('img', { src: window.LOGO_DATA, alt: '' }), h('div', {}, h('b', {}, t('brandName')), h('small', {}, t('adminPanel')))),
      nav),
    h('div', { class: 'main' },
      h('header', { class: 'topbar' }, title,
        h('div', { class: 'top-actions' },
          h('span', { class: 'who' }, CURRENT_USER ? CURRENT_USER.email : ''),
          toolbarButtons(() => { renderShell(); route(); }, [
            h('button', { type: 'button', class: 'top-btn', onclick: () => signOut(auth) }, icon('logout', 18), t('logout'))]))),
      banner, content)));

  if (ERROR_OFF) ERROR_OFF();
  ERROR_OFF = onStore(() => { banner.hidden = !store.error; }, ['error']);
  banner.hidden = !store.error;
}

function route() {
  const content = document.getElementById('content');
  if (!content) return;
  if (CLEANUP) { CLEANUP(); CLEANUP = null; }
  const name = routeName();
  document.querySelectorAll('.nav a').forEach((a) => a.classList.toggle('active', a.dataset.route === name));
  const top = document.querySelector('.top-title');
  if (top) top.textContent = t(ROUTES[name].key);
  content.replaceChildren();
  CLEANUP = ROUTES[name].view(content) || null;
  window.scrollTo(0, 0);
}

function showApp() {
  renderShell();
  route();
}

// ---------------------------------------------------------------- auth gate
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    CURRENT_USER = null;
    stopStore();
    showLogin(LOGIN_MESSAGE);
    LOGIN_MESSAGE = '';
    return;
  }
  try {
    // Role lives in users/{uid}.role. Only an admin (set in the console) may pass.
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists() || snap.data().role !== 'admin') {
      LOGIN_MESSAGE = t('notAdmin');
      await signOut(auth);   // the signed-out callback above shows the login screen + message
      return;
    }
  } catch (e) {
    console.error(e);
    LOGIN_MESSAGE = t('errGeneric');
    await signOut(auth);
    return;
  }
  CURRENT_USER = user;
  setNewBookingHandler((b) => toast(t('newBookingToast', { name: b.customerName || '', service: pick(b, 'serviceName') }), 'info'));
  startStore();
  showApp();
});

window.addEventListener('hashchange', () => { if (CURRENT_USER) route(); });

initTheme();
applyLang();
appRoot.replaceChildren(h('div', { class: 'splash' }, h('img', { src: window.LOGO_DATA, alt: '' })));

</script>
</body>
</html>
